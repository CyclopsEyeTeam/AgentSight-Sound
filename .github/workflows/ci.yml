name: Electric Sight & Sound CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-enclave-sight-and-sound:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Native AVX2 SIMD Shared Library
        run: make build

      - name: Run Full Vision + Audio Unit & Integration Suite (31 Suites)
        run: make test

      - name: Run Standalone CLI Self-Tests (NO_COLOR + Plain 7-bit ASCII)
        run: make selftest

      - name: Run Universal Connector Demo
        run: make demo
