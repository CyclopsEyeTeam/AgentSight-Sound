name: Electric Sight & Sound CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-enclave-sight-and-sound:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system media & test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install --upgrade pip Pillow python-xlib

      - name: Enable unprivileged user namespaces for Linux Enclave Isolation Test
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Verify Native AVX2 SIMD Shared Library & C11 Compilation
        run: |
          make build
          make verify-c-compile

      - name: Run Full Vision + Audio Unit & Integration Suite
        run: make test

      - name: Run Standalone CLI Self-Tests (NO_COLOR + Plain 7-bit ASCII)
        run: make selftest

      - name: Run Universal Connector Demo
        run: make demo
